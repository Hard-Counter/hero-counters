<title>Hero Counters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
  /* Dark-first palette; light tokens follow. */
  :root {
    color-scheme: dark;
    --bg: #0e1218;
    --bg-deep: #090c11;
    --surface: #161c25;
    --surface-2: #1f2733;
    --line: #2a3441;
    --ink: #edf1f6;
    --ink-2: #a2adbd;
    --ink-3: #6f7b8e;
    --accent: #f2b63d;
    --on-accent: #1b1303;
    --enemy: #ff5465;
    --vanguard: #6aa6ff;
    --duelist: #ff8c4d;
    --strategist: #3ed39b;
    --t-s: #ff7f7f;
    --t-a: #ffbf7f;
    --t-b: #ffdf7f;
    --t-c: #ffff7f;
    --t-d: #bfff7f;
    --t-f: #c9bfff;
    --tier-ink: #17120a;
    --ban-high: #ff5465;
    --ban-med: #f2a33d;
    --conf-data: #3ed39b;
    --conf-kit: #6aa6ff;
    --conf-consensus: #c69cff;
    --scrim: rgba(0, 0, 0, .6);
    --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
    --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      color-scheme: light;
      --bg: #f2f4f7;
      --bg-deep: #e3e7ed;
      --surface: #ffffff;
      --surface-2: #e8ecf1;
      --line: #d3dae3;
      --ink: #0e131a;
      --ink-2: #455064;
      --ink-3: #6e798c;
      --accent: #a06d00;
      --on-accent: #ffffff;
      --enemy: #d63447;
      --vanguard: #2e6bd9;
      --duelist: #cc5418;
      --strategist: #0c8f63;
      --ban-high: #d63447;
      --ban-med: #b36b00;
      --conf-data: #0c8a60;
      --conf-kit: #2e6bd9;
      --conf-consensus: #7c4dd8;
      --scrim: rgba(14, 19, 26, .45);
    }
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #f2f4f7;
    --bg-deep: #e3e7ed;
    --surface: #ffffff;
    --surface-2: #e8ecf1;
    --line: #d3dae3;
    --ink: #0e131a;
    --ink-2: #455064;
    --ink-3: #6e798c;
    --accent: #a06d00;
    --on-accent: #ffffff;
    --enemy: #d63447;
    --vanguard: #2e6bd9;
    --duelist: #cc5418;
    --strategist: #0c8f63;
    --ban-high: #d63447;
    --ban-med: #b36b00;
    --conf-data: #0c8a60;
    --conf-kit: #2e6bd9;
    --conf-consensus: #7c4dd8;
    --scrim: rgba(14, 19, 26, .45);
  }

  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg-deep);
    color: var(--ink);
    font: 400 15px/1.45 var(--font-body);
    -webkit-font-smoothing: antialiased;
  }
  button {
    font: inherit;
    color: inherit;
    background: none;
    border: 0;
    padding: 0;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  h1, h2, p { margin: 0; }

  .ic { display: inline-flex; width: 1em; height: 1em; flex: none; }
  .ic svg { width: 100%; height: 100%; display: block; }
  .ic.vanguard { color: var(--vanguard); }
  .ic.duelist { color: var(--duelist); }
  .ic.strategist { color: var(--strategist); }

  /* App shell */
  .shell {
    position: relative;
    height: 100%;
    max-width: 480px;
    margin-inline: auto;
    padding-inline: 16px;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    overflow: hidden;
  }
  @media (min-width: 520px) { .shell { border-inline: 1px solid var(--line); } }

  .top { display: flex; align-items: center; gap: 10px; padding-block: 14px 10px; }
  .mark { display: inline-flex; gap: 3px; height: 26px; padding-left: 3px; }
  .mark i { width: 6px; transform: skewX(-14deg); border-radius: 1px; }
  .mark .m-v { background: var(--vanguard); }
  .mark .m-d { background: var(--duelist); }
  .mark .m-s { background: var(--strategist); }
  .brand { flex: 1; min-width: 0; }
  .name { font: 800 22px/1 var(--font-display); letter-spacing: .03em; text-transform: uppercase; white-space: nowrap; }
  .meta { margin-top: 3px; font-size: 12px; color: var(--ink-3); letter-spacing: .02em; }
  .seg { display: inline-flex; padding: 2px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); }
  .seg button { padding: 6px 10px; border-radius: 7px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }

  .brackets {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    margin-inline: -16px;
    padding: 2px 16px 10px;
    scrollbar-width: none;
  }
  .brackets::-webkit-scrollbar { display: none; }
  .bracket {
    flex: none;
    padding: 8px 13px;
    font: 700 12.5px/1 var(--font-display);
    letter-spacing: .05em;
    text-transform: uppercase;
    color: var(--ink-2);
    background: var(--surface);
    clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
  }
  .bracket[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
  .bracket:focus-visible { outline: none; box-shadow: inset 0 -3px 0 var(--accent); }

  .view {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    margin-inline: -16px;
    padding: 2px 16px 28px;
    overscroll-behavior: contain;
  }

  .eyebrow {
    margin: 22px 0 8px;
    font: 700 12.5px/1.2 var(--font-display);
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
  .label {
    display: block;
    margin-bottom: 6px;
    font: 700 11.5px/1.2 var(--font-display);
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--ink-3);
  }

  .filters { display: flex; flex-wrap: wrap; gap: 6px; padding-block: 6px 12px; }
  .filter {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 11px;
    border-radius: 999px;
    border: 1px solid var(--line);
    color: var(--ink-2);
    font-size: 13px;
    font-weight: 600;
  }
  .filter[aria-pressed="true"] { background: var(--surface-2); border-color: var(--ink-3); color: var(--ink); }

  /* Tier list */
  .tier-row {
    display: grid;
    grid-template-columns: 44px minmax(0, 1fr);
    gap: 10px;
    padding-block: 10px;
    border-top: 1px solid var(--line);
  }
  .tier-row:first-child { border-top: 0; padding-top: 2px; }
  .tier {
    --s: 32px;
    width: var(--s);
    height: var(--s);
    flex: none;
    display: grid;
    place-items: center;
    border-radius: 6px;
    font: 800 calc(var(--s) * .62)/1 var(--font-display);
    color: var(--tier-ink);
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .07);
  }
  .t-s { background: var(--t-s); }
  .t-a { background: var(--t-a); }
  .t-b { background: var(--t-b); }
  .t-c { background: var(--t-c); }
  .t-d { background: var(--t-d); }
  .t-f { background: var(--t-f); }
  .tier-heroes { display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start; }

  .hero-chip {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    min-height: 36px;
    max-width: 100%;
    padding: 4px 11px 4px 4px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--surface);
    font-size: 13.5px;
    font-weight: 600;
    line-height: 1.15;
    text-align: left;
  }
  .hero-chip:hover { border-color: var(--ink-3); }
  .hero-chip.selected { border-color: var(--enemy); background: color-mix(in srgb, var(--enemy) 12%, var(--surface)); }
  .hero-chip.selected.ally { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
  .hero-chip[disabled] { opacity: .4; cursor: not-allowed; }
  .hc-name { min-width: 0; overflow-wrap: anywhere; }
  .hc-variant { display: inline-flex; margin-left: 4px; font-size: 11px; vertical-align: -1px; }
  .new {
    padding: 3px 5px;
    border-radius: 3px;
    background: var(--accent);
    color: var(--on-accent);
    font: 700 10.5px/1 var(--font-display);
    letter-spacing: .08em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .ban { width: 7px; height: 7px; flex: none; border-radius: 50%; background: var(--ban-high); }
  .ban.inline { display: inline-block; vertical-align: 1px; margin-right: 3px; }

  .av {
    --s: 28px;
    --c: var(--vanguard);
    width: var(--s);
    height: var(--s);
    flex: none;
    display: grid;
    place-items: center;
    border-radius: calc(var(--s) * .26);
    color: var(--c);
    background: color-mix(in srgb, var(--c) 17%, transparent);
    box-shadow: inset 0 -2px 0 var(--c);
    font: 800 calc(var(--s) * .44)/1 var(--font-display);
    letter-spacing: .04em;
  }
  .av.duelist { --c: var(--duelist); }
  .av.strategist { --c: var(--strategist); }

  .foot { margin-top: 16px; font-size: 12.5px; color: var(--ink-3); }

  /* Tags */
  .conf {
    --c: var(--conf-data);
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 7px;
    border-radius: 999px;
    border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
    color: var(--c);
    font: 700 10.5px/1.2 var(--font-display);
    letter-spacing: .08em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .conf::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
  .conf.kit { --c: var(--conf-kit); }
  .conf.consensus { --c: var(--conf-consensus); }
  .role-tag {
    --c: var(--vanguard);
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 10px 3px 8px;
    color: var(--c);
    background: color-mix(in srgb, var(--c) 14%, transparent);
    clip-path: polygon(5px 0, 100% 0, calc(100% - 5px) 100%, 0 100%);
    font: 700 11.5px/1.2 var(--font-display);
    letter-spacing: .1em;
    text-transform: uppercase;
  }
  .role-tag.duelist { --c: var(--duelist); }
  .role-tag.strategist { --c: var(--strategist); }

  /* Draft */
  .role-seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .role-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 10px 4px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink-2);
    font-size: 14px;
    font-weight: 600;
  }
  .role-btn .ic { font-size: 15px; }
  .role-btn.vanguard .ic { color: var(--vanguard); }
  .role-btn.duelist .ic { color: var(--duelist); }
  .role-btn.strategist .ic { color: var(--strategist); }
  .role-btn[aria-pressed="true"] { border-color: var(--accent); background: var(--surface-2); color: var(--ink); box-shadow: inset 0 -3px 0 var(--accent); }
  .row-between { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .link { padding: 4px 0; color: var(--accent); font-size: 14px; font-weight: 600; }
  .slots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .slot {
    position: relative;
    min-height: 84px;
    padding: 8px 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
    border-radius: 10px;
    font-size: 12.5px;
    font-weight: 600;
    text-align: center;
  }
  .slot.filled {
    background: color-mix(in srgb, var(--enemy) 9%, var(--surface));
    border: 1px solid color-mix(in srgb, var(--enemy) 42%, var(--line));
  }
  .slot.empty { border: 1.5px dashed var(--line); color: var(--ink-3); }
  .slot.empty .ic { font-size: 18px; }
  .slot-name { line-height: 1.15; overflow-wrap: anywhere; }
  .slot-x { position: absolute; top: 7px; right: 7px; font-size: 11px; color: var(--ink-3); }
  .example-note { margin-top: 8px; font-size: 12.5px; color: var(--ink-3); }
  .empty { margin-top: 18px; padding: 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
  .empty p { margin-bottom: 12px; color: var(--ink-2); }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 9px 14px;
    border-radius: 9px;
    background: var(--accent);
    color: var(--on-accent);
    font-size: 14px;
    font-weight: 700;
    white-space: nowrap;
  }
  .picks { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .pick {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px 10px 10px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--surface);
    text-align: left;
  }
  .pick.top { border-color: var(--accent); }
  .pick-n { width: 16px; font: 800 20px/1 var(--font-display); color: var(--ink-3); text-align: center; }
  .pick.top .pick-n { color: var(--accent); }
  .pick-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .pick-name { font-size: 15.5px; font-weight: 700; }
  .pick-why { font-size: 13px; color: var(--ink-2); }
  .pick-map { font-size: 12.5px; font-weight: 600; }
  .pick-map.good { color: var(--conf-data); }
  .pick-map.bad { color: var(--ban-med); }
  .map-btn {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--surface);
    text-align: left;
  }
  .map-btn.on { border-color: var(--accent); }
  .map-btn-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .map-name { font-size: 15px; font-weight: 700; }
  .map-meta { font-size: 12.5px; color: var(--ink-3); }
  .map-btn .link { flex: none; }
  .side-row { margin-top: 8px; }
  .matchups { display: grid; gap: 6px; }
  .mu {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 10px 12px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--surface);
    text-align: left;
  }
  .mu-head { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; font-size: 14px; font-weight: 600; }
  .mu-enemy, .mu-counter { display: inline-flex; align-items: center; gap: 6px; }
  .mu-enemy { color: var(--ink-2); }
  .mu-counter { font-weight: 700; }
  .mu-arrow { font-size: 15px; color: var(--ink-3); }
  .mu-why { font-size: 13.5px; color: var(--ink-2); }
  .mu-foot { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
  .mu-note { font-size: 12.5px; color: var(--ink-3); }
  .mu-note.warn { color: var(--ban-med); }

  /* Overlays */
  .sheet {
    position: absolute;
    inset: 0;
    z-index: 5;
    display: flex;
    flex-direction: column;
    padding-inline: 16px;
    background: var(--bg);
  }
  @media (prefers-reduced-motion: no-preference) {
    .sheet:not([hidden]) { animation: rise .18s ease-out; }
    @keyframes rise { from { transform: translateY(14px); opacity: .6; } to { transform: none; opacity: 1; } }
  }
  .sheet-head {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-inline: -16px;
    padding: 14px 16px 12px;
    border-bottom: 1px solid var(--line);
  }
  .sheet-body { flex: 1; min-height: 0; overflow-y: auto; margin-inline: -16px; padding: 4px 16px 28px; }
  .dh-title { flex: 1; min-width: 0; }
  .dh-name { margin-bottom: 5px; font: 800 26px/1.02 var(--font-display); letter-spacing: .02em; text-transform: uppercase; text-wrap: balance; }
  .dh-role { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
  .icon-btn { width: 38px; height: 38px; flex: none; display: grid; place-items: center; border-radius: 50%; background: var(--surface-2); font-size: 18px; }
  .tier-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .tier-cell {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 10px 4px 8px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink-2);
    font-size: 11.5px;
    text-align: center;
  }
  .tier-cell.current { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); color: var(--ink); }
  .notes { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 6px; font-size: 13.5px; color: var(--ink-2); }
  .notes li { display: flex; gap: 8px; }
  .notes li::before { content: ""; flex: none; width: 6px; height: 6px; margin-top: .5em; border-radius: 50%; background: var(--ink-3); }
  .notes .ban-high::before { background: var(--ban-high); }
  .notes .ban-medium::before { background: var(--ban-med); }
  .cc {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 12px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--surface);
    text-align: left;
  }
  .cc + .cc { margin-top: 6px; }
  .cc.mine { border-color: var(--accent); }
  .cc-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .mine-tag { font: 700 11px/1 var(--font-display); letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
  .cc-main { display: flex; align-items: center; gap: 10px; }
  .cc-name { flex: 1; min-width: 0; font-size: 16px; font-weight: 700; }
  .cc-why { font-size: 14px; }
  .cc-note, .cc-alt { font-size: 12.5px; color: var(--ink-3); }
  .cc-note.warn { color: var(--ban-med); }
  .map-title { flex: 1; min-width: 0; font: 800 20px/1.1 var(--font-display); letter-spacing: .02em; }
  .map-intro { margin: 10px 0 12px; font-size: 13.5px; color: var(--ink-2); }
  .map-group { display: grid; gap: 6px; }
  .map-row {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 10px 12px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--surface);
    text-align: left;
  }
  .map-row[aria-pressed="true"] { border-color: var(--accent); background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--accent); }
  .map-row-head { display: flex; align-items: baseline; flex-wrap: wrap; column-gap: 8px; }
  .map-row-name { font-size: 15px; font-weight: 700; }
  .map-row-world { font-size: 12.5px; color: var(--ink-3); }
  .map-row-note { font-size: 13px; line-height: 1.38; color: var(--ink-2); }
  .traits { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 2px; }
  .trait { padding: 2px 7px; border-radius: 999px; border: 1px solid var(--line); font-size: 11.5px; font-weight: 600; color: var(--ink-2); }

  .search {
    flex: 1;
    height: 40px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 12px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink-3);
  }
  .search:focus-within { border-color: var(--accent); }
  .search input { flex: 1; min-width: 0; height: 100%; border: 0; background: transparent; color: var(--ink); font: 500 15px var(--font-body); outline: none; }
  .picker-count { margin-bottom: 8px; font-size: 12.5px; color: var(--ink-3); }
  .picker-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
  .picker-grid .hero-chip { width: 100%; }
  #picker .filters { padding-top: 10px; }

  /* Comps */
  .lede { margin-top: 6px; font-size: 14px; color: var(--ink-2); }
  .comp { margin-top: 14px; padding: 14px; display: grid; gap: 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); }
  .comp-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .comp-name { font: 800 22px/1.05 var(--font-display); letter-spacing: .02em; text-transform: uppercase; text-wrap: balance; }

        if (key === 'class') el.className = value;
        else if (key === 'style') el.style.cssText = value;
        else if (key === 'html') el.innerHTML = value;
        else if (key === 'value') el.value = value;
        else if (key.startsWith('on')) el.addEventListener(key.slice(2).toLowerCase(), value);

  const toggleIn = (list, id, max) => (list.includes(id) ? list.filter((x) => x !== id) : list.length < max ? [...list, id] : list);
  const bannedIds = () => [...state.match.bans.ours, ...state.match.bans.theirs];

  const avatar = (hero, size = 28) =>
    h('span', { class: `av ${hero.role}`, style: `--s:${size}px`, 'aria-hidden': 'true' }, hero.abbr);
  const tierChip = (tier, size = 32) =>
    h('span', { class: `tier t-${tier.toLowerCase()}`, style: `--s:${size}px`, 'aria-label': `${tier} tier` }, tier);
  const confTag = (c) => h('span', { class: `conf ${c}` }, CONFIDENCE_LABEL[c]);
  const roleTag = (role) => h('span', { class: `role-tag ${role}` }, icon(role), ROLE_LABEL[role]);
  const focusTag = (level) => h('span', { class: `focus-tag ${level}` }, `Focus · ${FOCUS_LABEL[level]}`);
  const tipList = (items) => h('ul', { class: 'tips' }, items.map((t) => h('li', null, t)));
  const linkBtn = (label, onClick, aria) => h('button', { type: 'button', class: 'link', onClick, 'aria-label': aria || null }, label);

  /** A section eyebrow with an optional "what this means" button and a control on the right. */
  function sectionHead(title, opts = {}) {
    return h(
      'div',
      { class: 'sec', style: opts.style || null },
      h('h2', { class: 'eyebrow' }, title),
      opts.info ? h('button', { type: 'button', class: 'info-btn', 'aria-label': opts.infoLabel || 'What this means', onClick: () => openInfo(opts.info) }, icon('about')) : null,
      h('span', { class: 'spacer' }),
      opts.right || null,
    );
  }

  function heroChip(hero, onClick, opts = {}) {
    const label = [hero.name, hero.variant ? ROLE_LABEL[hero.role] : null, hero.banRisk === 'high' ? 'often banned' : null]
      .filter(Boolean)
      .join(', ');
    return h(
      'button',
      {
        type: 'button',
        class: 'hero-chip' + (opts.selected ? ' selected' : '') + (opts.tone === 'ally' ? ' ally' : ''),
        onClick,
        disabled: opts.disabled || null,
        'aria-pressed': opts.pressable ? String(!!opts.selected) : null,
        'aria-label': label,
      },
      avatar(hero, 26),
      h('span', { class: 'hc-name' }, hero.name, hero.variant ? h('span', { class: 'hc-variant' }, icon(hero.role, hero.role)) : null),
      hero.isNew ? h('span', { class: 'new' }, 'New') : null,
      hero.banRisk === 'high' ? h('span', { class: 'ban' }) : null,
    );
  }

  function set(patch) {
    const tabChanged = 'tab' in patch && patch.tab !== state.tab;
    Object.assign(state, patch);
    for (const key of ['tab', 'platform', 'bracket', 'role']) if (key in patch) store.set(key, state[key]);
    renderHeader();
    renderTabs();
    renderView(tabChanged);
    // Tier chips on an open hero page follow the platform and rank.
    if (('platform' in patch || 'bracket' in patch || 'role' in patch) && !$('detail').hidden) renderDetail(true);
  }

  /** Change the current match. Any edit ends the example. */
  function edit(fn) {
    state.match = { ...state.match, ...fn(state.match), example: false };
    renderView(false);
  }

  function renderHeader() {
    const showControls = state.tab === 'tiers' || state.tab === 'draft';
    const seg = $('platform');
    seg.hidden = !showControls;
    seg.replaceChildren(
      ...[['pc', 'PC'], ['console', 'Console']].map(([value, label]) =>
        h('button', { type: 'button', 'aria-pressed': String(state.platform === value), onClick: () => set({ platform: value }) }, label),
      ),
    );
    const strip = $('brackets');
    strip.hidden = !showControls;
    strip.replaceChildren(
      ...DATA.brackets.map((b) =>
        h('button', { type: 'button', class: 'bracket', 'aria-pressed': String(state.bracket === b.id), onClick: () => set({ bracket: b.id }) }, b.short),
      ),
    );
  }

  function renderTabs() {
    $('tabs').replaceChildren(
      ...TABS.map(([id, label]) =>
        h('button', { type: 'button', class: 'tab', 'aria-current': state.tab === id ? 'page' : null, onClick: () => set({ tab: id }) }, icon(id), h('span', null, label)),
      ),
    );
  }

  function renderView(resetScroll) {
    const view = $('view');
    const top = view.scrollTop;
    const build = { tiers: tiersView, draft: draftView, comps: compsView, about: aboutView }[state.tab];
    view.replaceChildren(build());
    view.scrollTop = resetScroll ? 0 : top;
  }

  function roleFilters(current, onPick) {
    return h(
      'div',
      { class: 'filters', role: 'group', 'aria-label': 'Filter by role' },
      [['all', 'All'], ...ROLES.map((r) => [r, ROLE_LABEL[r]])].map(([value, label]) =>
        h('button', { type: 'button', class: 'filter', 'aria-pressed': String(current === value), onClick: () => onPick(value) }, value === 'all' ? null : icon(value, value), label),
      ),
    );
  }

  // ---- Tiers ----
  function tiersView() {
    const list = h('div', { class: 'tier-list' });
    for (const tier of TIERS) {
      const heroes = sortHeroes(
        DATA.heroes.filter((x) => (state.roleFilter === 'all' || x.role === state.roleFilter) && tierFor(x, state.bracket, state.platform) === tier),
        state.bracket,
        state.platform,
      );
      if (!heroes.length) continue;
      list.append(
        h('section', { class: 'tier-row', 'aria-label': `${tier} tier` }, tierChip(tier, 44), h('div', { class: 'tier-heroes' }, heroes.map((x) => heroChip(x, () => openDetail(x.id, 'against'))))),
      );
    }
    return h(
      'div',
      null,
      roleFilters(state.roleFilter, (value) => set({ roleFilter: value })),
      list,
      h('p', { class: 'foot' }, `${bracketById(state.bracket).label} on ${platformName()}. `, h('span', { class: 'ban inline' }), 'Often banned at Gold III and above. Tap any hero for counters.'),
      h('p', { class: 'foot', style: 'margin-top:10px' }, linkBtn('What tiers and tags mean', () => openInfo('tiers'))),
    );
  }

  // ---- Draft ----
  function pickReason(p) {
    if (p.beats.length) return 'Counters ' + names(p.beats);
    if (p.edges.length) return 'Slight edge against ' + names(p.edges);
    return 'Strong pick at this rank';
  }

  function lookupResults() {
    const q = state.lookup.trim().toLowerCase();
    if (!q) return [];
    return DATA.heroes
      .filter((x) => x.name.toLowerCase().includes(q))
      .sort(
        (a, b) =>
          Number(!a.name.toLowerCase().startsWith(q)) - Number(!b.name.toLowerCase().startsWith(q)) ||
          a.name.localeCompare(b.name) ||
          ROLES.indexOf(a.role) - ROLES.indexOf(b.role),
      )
      .slice(0, 6);
  }

  // Updates only the results under the search box, so typing keeps the focus.
  function fillLookup(box) {
    const q = state.lookup.trim();
    const m = state.match;
    const banned = bannedIds();
    const rows = lookupResults();
    const kids = [];
    if (q && !rows.length) kids.push(h('p', { class: 'hint' }, `No hero matches “${q}”.`));
    for (const x of rows) {
      const isEnemy = m.enemies.includes(x.id);
      const canAdd = !isEnemy && m.enemies.length < MAX_ENEMIES && !banned.includes(x.id);
      kids.push(
        h(
          'div',
          { class: 'result' },
          h(
            'button',
            { type: 'button', class: 'result-main', 'aria-label': `How to beat ${x.name}`, onClick: () => lookUp(x.id) },
            avatar(x, 28),
            h('span', { class: 'flex1' }, h('span', { class: 'result-name' }, x.name), h('span', { class: 'result-sub' }, (x.variant ? ROLE_LABEL[x.role] + ' · ' : '') + 'See counters and tips')),
          ),
          canAdd
            ? h(
                'button',
                {
                  type: 'button',
                  class: 'add-enemy',
                  'aria-label': `Add ${x.name} to the enemy team`,
                  onClick: () => {
                    state.lookup = '';
                    edit((mm) => ({ enemies: toggleIn(mm.enemies, x.id, MAX_ENEMIES) }));
                  },
                },
                icon('plus'),
                'Enemy',
              )
            : isEnemy
              ? h('span', { class: 'result-tag' }, 'On enemy team')
              : null,
        ),
      );
    }
    box.replaceChildren(...kids);
  }

  function lookUp(id) {
    state.lookup = '';
    renderView(false);
    openDetail(id, 'against');
  }

  function banRow(label, side) {
    const ids = state.match.bans[side];
    const slots = [];
    for (let i = 0; i < MAX_BANS; i++) {
      const hero = IDX[ids[i]];
      slots.push(
        hero
          ? h(
              'button',
              {
                type: 'button',
                class: 'ban-slot filled',
                'aria-label': `Remove ban on ${hero.name}`,
                onClick: () => edit((m) => ({ bans: { ...m.bans, [side]: m.bans[side].filter((x) => x !== hero.id) } })),
              },
              avatar(hero, 22),
              h('span', { class: 'ban-name' }, hero.name),
            )
          : h('button', { type: 'button', class: 'ban-slot empty', 'aria-label': `Add a ban for ${side === 'ours' ? 'your team' : 'the enemy team'}`, onClick: () => openPicker(side) }, icon('plus'), 'Ban'),
      );
    }
    return h('div', { class: 'ban-group' }, h('span', { class: 'ban-label' }, label), h('div', { class: 'ban-row' }, slots));
  }

  function teamSlots(ids, max, tone, target) {
    const who = tone === 'enemy' ? 'the enemy team' : 'your team';
    const slots = h('div', { class: 'slots' });
    for (let i = 0; i < max; i++) {
      const hero = IDX[ids[i]];
      slots.append(
        hero
          ? h(
              'button',
              {
                type: 'button',
                class: 'slot filled' + (tone === 'ally' ? ' ally' : ''),
                'aria-label': `Remove ${hero.name} from ${who}`,
                onClick: () => edit((m) => ({ [target]: m[target].filter((e) => e !== hero.id) })),
              },
              avatar(hero, 30),
              h('span', { class: 'slot-name' }, hero.name),
              icon('close', 'slot-x'),
            )
          : h('button', { type: 'button', class: 'slot empty', 'aria-label': `Add a hero to ${who}`, onClick: () => openPicker(target) }, icon('plus'), 'Add'),
      );
    }
    return slots;
  }

  function draftView() {
    const m = state.match;
    const map = MAPS.find((x) => x.id === m.mapId) || null;
    const banned = bannedIds();
    const started = !!(map || banned.length || m.allies.length || m.enemies.length || m.protectId);
    const showPicks = !!(map || banned.length || m.allies.length || m.enemies.length);
    const wrap = h('div', null);

    // Quick lookup: the most common use is one hero causing trouble.
    wrap.append(sectionHead('Who’s giving you trouble?', { style: 'margin-top:10px' }));
    const results = h('div', { class: 'results', id: 'lookup-results' });
    const input = h('input', {
      id: 'lookup',
      type: 'search',
      placeholder: 'Search a hero to see how to beat them',
      autocomplete: 'off',
      'aria-label': 'Search a hero to see how to beat them',
      value: state.lookup,
      onInput: (e) => {
        state.lookup = e.target.value;
        fillLookup(results);
      },
      onKeydown: (e) => {
        if (e.key !== 'Enter') return;
        const first = lookupResults()[0];
        if (first) lookUp(first.id);
      },
    });
    wrap.append(h('label', { class: 'search lookup' }, icon('search'), input));
    fillLookup(results);
    wrap.append(results);

    wrap.append(sectionHead('Your role', { right: started ? linkBtn('New match', () => { state.match = emptyMatch(); renderView(false); }) : null }));
    wrap.append(
      h(
        'div',
        { class: 'role-seg', role: 'group', 'aria-label': 'Your role' },
        ROLES.map((r) => h('button', { type: 'button', class: `role-btn ${r}`, 'aria-pressed': String(state.role === r), onClick: () => set({ role: r }) }, icon(r), ROLE_LABEL[r])),
      ),
    );

    if (MAPS.length) {
      wrap.append(sectionHead('Map', { info: 'maps', infoLabel: 'What map modes and tags mean' }));
      wrap.append(
        h(
          'button',
          { type: 'button', class: 'map-btn' + (map ? ' on' : ''), 'aria-label': map ? `Map: ${map.name}. Change the map` : 'Pick a map', onClick: openMapPicker },
          h(
            'span',
            { class: 'map-btn-body' },
            h('span', { class: 'map-name' }, map ? map.name : 'Any map'),
            h('span', { class: 'map-meta' }, map ? [MAP_MODE_LABEL[map.mode], ...map.traits.map((tr) => MAP_TRAIT_LABEL[tr])].join(' · ') : 'Optional. Pick one to suit your picks to the layout.'),
          ),
          h('span', { class: 'link' }, map ? 'Change' : 'Pick'),
        ),
      );
      if (map && hasSides(map.mode)) {
        wrap.append(
          h(
            'div',
            { class: 'side-row' },
            h(
              'div',
              { class: 'seg', role: 'group', 'aria-label': 'Your side' },
              MAP_SIDES.map((s) =>
                h('button', { type: 'button', 'aria-pressed': String(m.side === s), onClick: () => { state.match = { ...state.match, side: s }; renderView(false); } }, MAP_SIDE_LABEL[s]),
              ),
            ),
          ),
        );
      }
    }

    wrap.append(
      sectionHead(`Bans · ${banned.length}/${MAX_BANS * 2}`, {
        info: 'bans',
        infoLabel: 'How bans work',
        right: banned.length ? linkBtn('Clear', () => edit(() => ({ bans: { ours: [], theirs: [] } }))) : null,
      }),
    );
    wrap.append(banRow('Your team', 'ours'), banRow('Enemy team', 'theirs'));
    wrap.append(protectBlock());

    wrap.append(
      sectionHead(`Your team · ${m.allies.length}/${MAX_ALLIES}`, {
        info: 'match',
        infoLabel: 'What team-ups are',
        right: m.allies.length ? linkBtn('Clear', () => edit(() => ({ allies: [] }))) : null,
      }),
    );
    if (!m.allies.length) wrap.append(h('p', { class: 'hint' }, 'Your teammates, as they lock in. Leave yourself out.'));
    wrap.append(teamSlots(m.allies, MAX_ALLIES, 'ally', 'allies'));
    const note = teamNote(m.allies.map((id) => IDX[id]).filter(Boolean), state.role);
    if (note) wrap.append(h('p', { class: 'team-note' }, note));

    wrap.append(sectionHead(`Enemy team · ${m.enemies.length}/${MAX_ENEMIES}`, { right: m.enemies.length ? linkBtn('Clear', () => edit(() => ({ enemies: [] }))) : null }));
    if (!m.enemies.length) wrap.append(h('p', { class: 'hint' }, 'Add enemies as you spot them on the scoreboard.'));
    wrap.append(teamSlots(m.enemies, MAX_ENEMIES, 'enemy', 'enemies'));

    if (!started) {
      wrap.append(
        h(
          'div',
          { class: 'empty' },
          h('p', null, 'Fill this in as the match goes: bans and your team during hero select, the enemy team once you see the scoreboard. Suggestions update as you go.'),
          h(
            'button',
            {
              type: 'button',
              class: 'btn',
              onClick: () => {
                state.match = { ...emptyMatch(), bans: { ours: [...EXAMPLE.bans.ours], theirs: [...EXAMPLE.bans.theirs] }, allies: [...EXAMPLE.allies], enemies: [...EXAMPLE.enemies], example: true };
                renderView(false);
              },
            },
            'Try an example match',
          ),
        ),
      );
    }
    if (m.example) wrap.append(h('p', { class: 'example-note' }, 'Example match. Tap a hero to remove it, or New match to start your own.'));

    const ctx = map ? { map, side: m.side } : null;
    const { picks, matchups } = draft(DATA, IDX, state.role, m.enemies, state.bracket, state.platform, { map: ctx, banned, allies: m.allies, teamUps: TEAM_UPS });

    if (showPicks) {
      wrap.append(sectionHead(`Best ${ROLE_LABEL[state.role]} picks${map && !m.enemies.length ? ` on ${map.name}` : ''}`));
      if (!picks.length) wrap.append(h('p', { class: 'hint' }, `Every ${ROLE_LABEL[state.role]} is banned or taken.`));
      wrap.append(
        h(
          'ol',
          { class: 'picks' },
          picks.map((p, i) => {
            const mapLine = mapNote(p.map);
            return h(
              'li',
              null,
              h(
                'button',
                { type: 'button', class: 'pick' + (i === 0 ? ' top' : ''), onClick: () => openDetail(p.hero.id, 'as') },
                h('span', { class: 'pick-n' }, String(i + 1)),
                avatar(p.hero, 36),
                h(
                  'span',
                  { class: 'pick-body' },
                  h('span', { class: 'pick-name' }, p.hero.name),
                  h('span', { class: 'pick-why' }, pickReason(p)),
                  p.teamUps.map((t) => h('span', { class: 'pick-teamup' }, teamUpLabel(t))),
                  mapLine ? h('span', { class: 'pick-map ' + (p.map.score > 0 ? 'good' : 'bad') }, mapLine) : null,
                ),
                tierChip(p.tier, 30),
              ),
            );
          }),
        ),
      );
    }

    const enemyHeroes = m.enemies.map((id) => IDX[id]).filter(Boolean);
    if (enemyHeroes.length >= 2) {
      wrap.append(sectionHead('Focus first', { info: 'match', infoLabel: 'What focus priority means' }));
      wrap.append(
        h(
          'div',
          { class: 'matchups' },
          focusOrder(enemyHeroes, state.bracket, state.platform).map((f, i) =>
            h(
              'button',
              { type: 'button', class: 'focus-row', onClick: () => openDetail(f.hero.id, 'against') },
              h('span', { class: 'focus-n' }, String(i + 1)),
              avatar(f.hero, 28),
              h('span', { class: 'focus-body' }, h('span', { class: 'focus-head' }, h('span', { class: 'focus-name' }, f.hero.name), focusTag(f.level)), h('span', { class: 'focus-why' }, f.why)),
            ),
          ),
        ),
      );
    }

    if (matchups.length) {
      wrap.append(sectionHead('Your counter to each enemy'));
      wrap.append(h('div', { class: 'matchups' }, matchups.map(matchupCard)));
    }
    return wrap;
  }

  function protectBlock() {
    const m = state.match;
    const hero = m.protectId ? IDX[m.protectId] : null;
    if (!hero) {
      return h(
        'button',
        { type: 'button', class: 'map-btn protect-btn', onClick: () => openPicker('protect') },
        h('span', { class: 'map-btn-body' }, h('span', { class: 'map-name' }, 'Protect your pick'), h('span', { class: 'map-meta' }, 'Choose the hero you want to play to see which counters to ban.')),
        h('span', { class: 'link' }, 'Choose'),
      );
    }
    const oursFull = m.bans.ours.length >= MAX_BANS;
    const ideas = banSuggestions(IDX, hero.id, state.bracket, state.platform, [...bannedIds(), ...m.allies, ...m.enemies]);
    return h(
      'div',
      { class: 'protect' },
      h(
        'div',
        { class: 'protect-head' },
        h('span', { class: 'protect-label' }, 'Protect your pick'),
        h('span', { class: 'flex1' }),
        linkBtn('Change', () => openPicker('protect')),
        h('button', { type: 'button', class: 'icon-btn', style: 'width:28px;height:28px;font-size:13px', 'aria-label': 'Stop protecting this pick', onClick: () => { state.match = { ...state.match, protectId: null }; renderView(false); } }, icon('close')),
      ),
      h('div', { class: 'protect-hero' }, avatar(hero, 30), h('span', null, 'Ban these to protect ', h('strong', null, hero.name), ':')),
      ideas.length ? null : h('p', { class: 'hint' }, 'Its listed counters are already banned or picked.'),
      ideas.map((b) =>
        h(
          'div',
          { class: 'ban-idea' },
          avatar(b.hero, 28),
          h('span', { class: 'flex1' }, h('span', { class: 'ban-idea-name' }, b.hero.name), h('span', { class: 'ban-idea-why' }, b.pick.reason)),
          h('button', { type: 'button', class: 'ban-btn', disabled: oursFull || null, 'aria-label': `Ban ${b.hero.name}`, onClick: () => edit((mm) => ({ bans: { ...mm.bans, ours: toggleIn(mm.bans.ours, b.hero.id, MAX_BANS) } })) }, 'Ban'),
        ),
      ),
      oursFull && ideas.length ? h('p', { class: 'hint', style: 'margin:0' }, 'Your team’s three bans are used.') : null,
    );
  }

  function matchupCard(mu) {
    const note =
      mu.status === 'ally'
        ? `${mu.counter.name} is already on your team.`
        : mu.status === 'banned'
          ? `${mu.counter.name} is banned, and no other ${ROLE_LABEL[state.role]} is listed. Lean on your team.`
          : mu.instead
            ? `${mu.instead.name} is banned, so ${mu.counter.name} stands in.`
            : null;
    return h(
      'button',
      { type: 'button', class: 'mu' + (mu.status === 'banned' ? ' banned' : ''), onClick: () => (mu.status === 'banned' ? openDetail(mu.enemy.id, 'against') : openDetail(mu.counter.id, 'as')) },
      h(
        'span',
        { class: 'mu-head' },
        h('span', { class: 'mu-enemy' }, avatar(mu.enemy, 24), mu.enemy.name),
        icon('arrow', 'mu-arrow'),
        h('span', { class: 'mu-counter' }, avatar(mu.counter, 24), mu.counter.name),
        mu.status === 'ally' ? h('span', { class: 'mu-tag ally' }, 'On your team') : null,
        mu.status === 'banned' ? h('span', { class: 'mu-tag banned' }, 'Banned') : null,
      ),
      h('span', { class: 'mu-why' }, mu.pick.reason),
      h('span', { class: 'mu-foot' }, confTag(mu.pick.confidence), mu.pick.note ? h('span', { class: 'mu-note' + (mu.pick.weak ? ' warn' : '') }, mu.pick.note) : null),
      note ? h('span', { class: 'mu-note status' }, note) : null,
    );
  }

  // ---- Hero picker (bans, teams, the hero you want to play) ----
  function pickerConfig() {
    const m = state.match;
    const banned = bannedIds();
    switch (state.picker) {
      case 'ours':
        return { title: 'Your team’s bans', selected: m.bans.ours, max: MAX_BANS, unavailable: [...m.bans.theirs, ...m.allies, ...m.enemies] };
      case 'theirs':
        return { title: 'Enemy bans', selected: m.bans.theirs, max: MAX_BANS, unavailable: [...m.bans.ours, ...m.allies, ...m.enemies] };
      case 'allies':
        return { title: 'Your team', selected: m.allies, max: MAX_ALLIES, unavailable: banned, tone: 'ally' };
      case 'enemies':
        return { title: 'Enemy team', selected: m.enemies, max: MAX_ENEMIES, unavailable: banned };
      case 'protect':
        return { title: 'The hero you want to play', selected: m.protectId ? [m.protectId] : [], max: 1, single: true, unavailable: [...banned, ...m.allies], tone: 'ally', initialRole: state.role };
      default:
        return { title: '', selected: [], max: 0, unavailable: [] };
    }
  }

  function openPicker(target) {
    state.picker = target;
    state.pickerQuery = '';
    state.pickerRole = pickerConfig().initialRole || 'all';
    const input = h('input', {
      id: 'picker-search',
      type: 'search',
      placeholder: 'Search heroes',
      autocomplete: 'off',
      'aria-label': 'Search heroes',
      onInput: (e) => {
        state.pickerQuery = e.target.value;
        renderPickerList();
      },
    });
    $('picker').replaceChildren(
      h('div', { class: 'sheet-head' }, h('label', { class: 'search' }, icon('search'), input), h('button', { type: 'button', class: 'btn', onClick: closePicker }, 'Done')),
      h('div', { id: 'picker-filters' }),
      h('p', { class: 'picker-count', id: 'picker-count' }),
      h('div', { class: 'sheet-body', id: 'picker-list' }),
    );
    $('picker').hidden = false;
    renderPickerList();
  }

  function renderPickerList() {
    const cfg = pickerConfig();
    $('picker-filters').replaceChildren(
      h('h2', { class: 'eyebrow', style: 'margin:12px 0 0' }, cfg.single ? cfg.title : `${cfg.title} · ${cfg.selected.length}/${cfg.max}`),
      roleFilters(state.pickerRole, (value) => {
        state.pickerRole = value;
        renderPickerList();
      }),
    );
    const q = state.pickerQuery.trim().toLowerCase();
    const heroes = DATA.heroes
      .filter((x) => (state.pickerRole === 'all' || x.role === state.pickerRole) && (!q || x.name.toLowerCase().includes(q)))
      .sort((a, b) => a.name.localeCompare(b.name) || ROLES.indexOf(a.role) - ROLES.indexOf(b.role));
    const full = !cfg.single && cfg.selected.length >= cfg.max;
    $('picker-count').textContent = cfg.unavailable.length ? 'Greyed-out heroes are banned or already picked.' : '';
    const list = $('picker-list');
    const top = list.scrollTop;
    list.replaceChildren(
      heroes.length
        ? h(
            'div',
            { class: 'picker-grid' },
            heroes.map((x) => {
              const on = cfg.selected.includes(x.id);
              const off = cfg.unavailable.includes(x.id);
              return heroChip(x, () => onPickerToggle(x.id), { selected: on, pressable: true, disabled: !on && (off || full), tone: cfg.tone });
            }),
          )
        : h('p', { class: 'foot' }, `No hero matches “${state.pickerQuery}”.`),
    );
    list.scrollTop = top;
  }

  function onPickerToggle(id) {
    const m = state.match;
    switch (state.picker) {
      case 'ours':
        state.match = { ...m, example: false, bans: { ...m.bans, ours: toggleIn(m.bans.ours, id, MAX_BANS) } };
        break;
      case 'theirs':
        state.match = { ...m, example: false, bans: { ...m.bans, theirs: toggleIn(m.bans.theirs, id, MAX_BANS) } };
        break;
      case 'allies':
        state.match = { ...m, example: false, allies: toggleIn(m.allies, id, MAX_ALLIES) };
        break;
      case 'enemies':
        state.match = { ...m, example: false, enemies: toggleIn(m.enemies, id, MAX_ENEMIES) };
        break;
      case 'protect':
        state.match = { ...m, protectId: m.protectId === id ? null : id };
        closePicker();
        return;
    }
    renderPickerList();
  }

  function closePicker() {
    state.picker = null;
    $('picker').hidden = true;
    renderView(false);
  }

  // ---- Map picker ----
  function mapRow(label, detail, opts) {
    return h(
      'button',
      { type: 'button', class: 'map-row', 'aria-pressed': String(opts.on), onClick: opts.onClick },
      h('span', { class: 'map-row-head' }, h('span', { class: 'map-row-name' }, label), opts.world ? h('span', { class: 'map-row-world' }, opts.world) : null),
      h('span', { class: 'map-row-note' }, detail),
      opts.traits && opts.traits.length ? h('span', { class: 'traits' }, opts.traits.map((tr) => h('span', { class: 'trait' }, tr))) : null,
    );
  }

  function openMapPicker() {
    const choose = (id) => {
      state.match = { ...state.match, mapId: id };
      closeMapPicker();
    };
    const legendBox = h(
      'div',
      { class: 'tag-legend', hidden: !state.legend || null },
      Object.keys(MAP_TRAIT_INFO).map((tr) => h('p', null, h('b', null, MAP_TRAIT_LABEL[tr] + '. '), MAP_TRAIT_INFO[tr])),
    );
    const toggle = h(
      'button',
      {
        type: 'button',
        class: 'legend-toggle',
        'aria-expanded': String(state.legend),
        onClick: (e) => {
          state.legend = !state.legend;
          legendBox.hidden = !state.legend;
          e.currentTarget.textContent = state.legend ? 'Hide what the tags mean' : 'What the tags mean';
          e.currentTarget.setAttribute('aria-expanded', String(state.legend));
        },
      },
      state.legend ? 'Hide what the tags mean' : 'What the tags mean',
    );
    const body = h(
      'div',
      { class: 'sheet-body' },
      h('p', { class: 'map-intro' }, 'The map nudges close calls toward heroes whose play style suits its layout. Counters still count most.'),
      toggle,
      legendBox,
      mapRow('Any map', 'Don’t factor in the map', { on: state.match.mapId === null, onClick: () => choose(null) }),
      MAP_MODES.map((mode) => {
        const inMode = MAPS.filter((x) => x.mode === mode).sort((a, b) => a.name.localeCompare(b.name));
        if (!inMode.length) return null;
        return [
          eyebrow(MAP_MODE_LABEL[mode]),
          h('p', { class: 'mode-info' }, MAP_MODE_INFO[mode]),
          h(
            'div',
            { class: 'map-group' },
            inMode.map((x) => mapRow(x.name, x.note, { world: x.world, traits: x.traits.map((tr) => MAP_TRAIT_LABEL[tr]), on: state.match.mapId === x.id, onClick: () => choose(x.id) })),
          ),
        ];
      }),
      h('p', { class: 'foot' }, 'Ranked maps only. The list is updated as the map pool rotates.'),
    );
    $('mappicker').replaceChildren(
      h('div', { class: 'sheet-head' }, h('h1', { class: 'map-title', id: 'mappicker-title' }, 'Pick the map'), h('button', { type: 'button', class: 'btn', onClick: closeMapPicker }, 'Done')),
      body,
    );
    $('mappicker').hidden = false;
  }

  function closeMapPicker() {
    $('mappicker').hidden = true;
    renderView(false);
  }

  // ---- Overlay cards ----
  function openOverlay(content) {
    const o = $('overlay');
    o.replaceChildren(h('div', { class: 'overlay-backdrop', onClick: closeOverlay }), h('div', { class: 'overlay-card', role: 'dialog', 'aria-modal': 'true' }, content));
    o.hidden = false;
    const btn = o.querySelector('button');
    if (btn) btn.focus({ preventScroll: true });
  }

  function closeOverlay() {
    const o = $('overlay');
    o.hidden = true;
    o.replaceChildren();
  }

  function glossaryTerms(group) {
    return h(
      'div',
      { class: 'terms' },
      group.intro ? h('p', { class: 'term-intro' }, group.intro) : null,
      group.terms.map((term) => h('div', { class: 'term' }, term.confidence ? confTag(term.confidence) : h('b', null, term.term), h('p', null, term.text))),
    );
  }

  function openInfo(groupId) {
    const group = glossaryGroup(groupId);
    openOverlay([
      h('div', { class: 'card-head' }, h('h2', { class: 'card-title' }, group.title), h('button', { type: 'button', class: 'icon-btn', 'aria-label': 'Close', onClick: closeOverlay }, icon('close'))),
      glossaryTerms(group),
    ]);
  }

  /** A quick look at a hero tapped on a hero page, so a stray tap doesn't leave the page. */
  function openPeek(peek) {
    const top = state.detailStack[state.detailStack.length - 1];
    const hero = top && IDX[top.id];
    const other = IDX[peek.heroId];
    if (!hero || !other) return;
    let label;
    let pick;
    if (peek.kind === 'counter') {
      label = `Counters ${hero.name}`;
      pick = peek.pick;
    } else if (peek.kind === 'teamup') {
      label = peek.label;
    } else {
      label = `${hero.name} counters ${other.name}`;
      for (const k of [hero.role, 'overall', ...ROLES.filter((r) => r !== hero.role)]) {
        const p = other.counters[k];
        if (p && (p.hero === hero.id || (p.alt || []).includes(hero.id))) {
          pick = p;
          break;
        }
      }
    }
    openOverlay(
      h(
        'div',
        { class: 'peek', 'aria-label': `${other.name}, quick look` },
        h(
          'div',
          { class: 'peek-head' },
          avatar(other, 44),
          h('div', { class: 'dh-title' }, h('div', { class: 'peek-name' }, other.name), h('div', { class: 'dh-role' }, roleTag(other.role), other.isNew ? h('span', { class: 'new' }, 'New') : null)),
          tierChip(tierFor(other, state.bracket, state.platform), 34),
        ),
        pick
          ? h(
              'div',
              { class: 'peek-why' },
              h('span', { class: 'peek-label' }, label),
              h('span', null, pick.reason),
              h('span', { class: 'peek-foot' }, confTag(pick.confidence), pick.note ? h('span', { class: 'cc-note' + (pick.weak ? ' warn' : '') }, pick.note) : null),
            )
          : null,
        peek.kind === 'teamup'
          ? h('div', { class: 'peek-why' }, h('span', { class: 'peek-label' }, 'Team-up · ' + label), peek.text ? h('span', null, peek.text) : null)
          : null,
        other.banRisk !== 'low' ? h('ul', { class: 'notes' }, h('li', { class: `ban-${other.banRisk}` }, BAN_LABEL[other.banRisk] + '.')) : null,
        h(
          'div',
          { class: 'peek-buttons' },
          // A counter or team-up partner is someone you'd play; a hero this one beats is an enemy.
          h('button', { type: 'button', class: 'btn wide', onClick: () => { closeOverlay(); pushDetail(other.id, peek.kind === 'strong' ? 'against' : 'as'); } }, `Open ${other.name}`),
          h('button', { type: 'button', class: 'btn-secondary', onClick: closeOverlay }, 'Close'),
        ),
      ),
    );
  }

  // ---- Hero detail ----
  function counterCard(pick, role) {
    const c = IDX[pick.hero];
    if (!c) return null;
    const mine = role && role === state.role;
    return h(
      'button',
      { type: 'button', class: 'cc' + (mine ? ' mine' : ''), onClick: () => openPeek({ kind: 'counter', heroId: c.id, pick }) },
      role ? h('span', { class: 'cc-top' }, roleTag(role), mine ? h('span', { class: 'mine-tag' }, 'Your role') : null) : null,
      h('span', { class: 'cc-main' }, avatar(c, 38), h('span', { class: 'cc-name' }, c.name), confTag(pick.confidence)),
      h('span', { class: 'cc-why' }, pick.reason),
      pick.note ? h('span', { class: 'cc-note' + (pick.weak ? ' warn' : '') }, pick.note) : null,
      pick.alt && pick.alt.length ? h('span', { class: 'cc-alt' }, 'Also good: ' + names(pick.alt.map((a) => IDX[a]).filter(Boolean))) : null,
    );
  }

  // Each hero page in the stack remembers its tab. Tier list and enemies open on Against,
  // picks, counters and comps on Play as.
  function openDetail(id, tab = 'against') {
    if (!IDX[id]) return;
    state.detailStack = [{ id, tab }];
    renderDetail();
  }

  function pushDetail(id, tab = 'against') {
    const s = state.detailStack;
    if (!s.length || s[s.length - 1].id !== id) state.detailStack = [...s, { id, tab }].slice(-20);
    renderDetail();
  }

  function setDetailTab(tab) {
    const s = state.detailStack;
    if (!s.length || s[s.length - 1].tab === tab) return;
    state.detailStack = [...s.slice(0, -1), { ...s[s.length - 1], tab }];
    const body = $('detail').querySelector('.sheet-body');
    const anchor = $('detail').querySelector('.dtabs-anchor');
    const bar = $('detail').querySelector('.dtabs');
    // Keep the tab bar where it is and start the new tab from its top. The anchor sits just
    // above the sticky bar's top margin, so its position doesn't move when the bar sticks.
    const gap = bar ? parseFloat(getComputedStyle(bar).marginTop) || 0 : 0;
    const barY = body && anchor ? anchor.getBoundingClientRect().top - body.getBoundingClientRect().top + body.scrollTop + gap : 0;
    const top = body ? Math.min(body.scrollTop, barY) : 0;
    renderDetail();
    const nb = $('detail').querySelector('.sheet-body');
    if (nb) nb.scrollTop = top;
  }

  function popDetail() {
    state.detailStack = state.detailStack.slice(0, -1);
    renderDetail();
  }

  function closeDetail() {
    state.detailStack = [];
    closeOverlay();
    $('detail').hidden = true;
  }

  function renderDetail(keepScroll) {
    const stack = state.detailStack;
    const top = stack[stack.length - 1];
    const hero = top && IDX[top.id];
    closeOverlay();
    if (!hero) {
      $('detail').hidden = true;
      return;
    }
    const oldBody = $('detail').querySelector('.sheet-body');
    const oldTop = keepScroll && oldBody ? oldBody.scrollTop : 0;
    const backTo = stack.length > 1 ? IDX[stack[stack.length - 2].id] : null;
    const tips = tipsFor(hero);
    const focus = focusFor(hero);
    const kit = kitFor(hero);
    const ups = heroTeamUps(hero.id, usableTeamUps(DATA, IDX), IDX);
    const strong = sortHeroes(goodAgainst(DATA, hero.id), state.bracket, state.platform);
    const hasAbilities = !!kit || !!(tips && tips.quirks.length) || ups.own.length > 0;
    const tabs = HERO_TABS.filter((k) => k !== 'abilities' || hasAbilities);
    const active = tabs.includes(top.tab) ? top.tab : 'against';
    const body = h('div', { class: 'sheet-body' });

    body.append(sectionHead(`Tier by rank · ${platformName()}`, { info: 'tiers', infoLabel: 'What tiers mean' }));
    body.append(
      h(
        'div',
        { class: 'tier-grid' },
        DATA.brackets.map((b) => h('div', { class: 'tier-cell' + (b.id === state.bracket ? ' current' : '') }, tierChip(tierFor(hero, b.id, state.platform), 36), h('span', null, b.short))),
      ),
    );
    body.append(
      h(
        'ul',
        { class: 'notes' },
        h('li', { class: `ban-${hero.banRisk}` }, BAN_LABEL[hero.banRisk] + '.'),
        hero.patchNote ? h('li', null, hero.patchNote) : null,
        hero.platformNote ? h('li', null, 'Console: ' + hero.platformNote) : null,
      ),
    );
    body.append(h('div', { class: 'dtabs-anchor' }));
    body.append(
      h(
        'div',
        { class: 'dtabs', role: 'tablist', 'aria-label': `${hero.name} pages` },
        tabs.map((k) => h('button', { type: 'button', class: 'dtab', role: 'tab', 'aria-selected': String(k === active), onClick: () => setDetailTab(k) }, HERO_TAB_LABEL[k])),
      ),
    );

    const peekTeamUp = (u, other) =>
      openPeek({
        kind: 'teamup',
        heroId: other.id,
        label: u.user.id === hero.id ? u.name : `${u.user.name}’s ${u.name}`,
        text: u.bonus ? `With ${u.partner.name} on the team: ${u.bonus[0].toLowerCase()}${u.bonus.slice(1)}` : u.effect,
      });
    const teamRow = (other, detail, onClick) =>
      h('button', { type: 'button', class: 'team-row', onClick }, avatar(other, 32), h('span', { class: 't' }, h('b', null, other.name), h('small', null, detail)), icon('chevron'));

    if (active === 'against') {
      if (!focus.general) {
        body.append(sectionHead('Focus priority', { info: 'match', infoLabel: 'What focus priority means' }));
        body.append(h('div', { class: 'focus-box' }, focusTag(focus.level), h('p', null, focus.why)));
      }
      body.append(sectionHead('Best counter overall', { info: 'counters', infoLabel: 'What the counter tags mean' }));
      body.append(counterCard(hero.counters.overall));
      body.append(sectionHead('Best counter in each role'));
      for (const r of [state.role, ...ROLES.filter((x) => x !== state.role)]) body.append(counterCard(hero.counters[r], r));
      if (tips && tips.against.length) {
        body.append(sectionHead(`How to play against ${hero.name}`));
        body.append(tipList(tips.against));
      }
    } else if (active === 'as') {
      if (hero.styles && hero.styles.length) {
        body.append(sectionHead('Play style', { info: 'styles', infoLabel: 'What play styles mean' }));
        body.append(h('div', { class: 'style-list' }, hero.styles.filter((s) => HERO_STYLE_LABEL[s]).map((s) => h('p', null, h('b', null, HERO_STYLE_LABEL[s] + '. '), HERO_STYLE_INFO[s]))));
      }
      if (tips && tips.as.length) {
        body.append(sectionHead(`How to play ${hero.name}`));
        body.append(tipList(tips.as));
      }
      if (ups.own.length || ups.boosts.length) {
        body.append(sectionHead('Team-up partners', { info: 'match', infoLabel: 'What team-ups are' }));
        body.append(
          h(
            'div',
            { class: 'team-list' },
            ups.own.map((u) => teamRow(u.partner, `Makes your ${u.name} stronger`, () => peekTeamUp(u, u.partner))),
            ups.boosts.map((u) => teamRow(u.user, `You make their ${u.name} stronger`, () => peekTeamUp(u, u.user))),
          ),
        );
      }
      if (strong.length) {
        body.append(sectionHead('Strong against'));
        body.append(h('div', { class: 'tier-heroes' }, strong.map((x) => heroChip(x, () => openPeek({ kind: 'strong', heroId: x.id })))));
      }
      if (!(hero.styles && hero.styles.length) && !(tips && tips.as.length) && !ups.own.length && !ups.boosts.length && !strong.length) {
        body.append(h('p', { class: 'empty-note' }, `No play notes for ${hero.name} yet.`));
      }
    } else {
      if (kit) {
        kit.groups.forEach((g, i) => {
          body.append(sectionHead(g.label, i === 0 ? { info: 'abilities', infoLabel: 'What the ability terms mean' } : {}));
          body.append(h('div', { class: 'abilities' }, g.abilities.map((a) => h('div', { class: 'ability' }, h('b', null, a.name), h('p', null, a.text)))));
        });
      }
      if (ups.own.length) {
        body.append(sectionHead('Team-up abilities', { info: 'match', infoLabel: 'What team-ups are' }));
        body.append(h('p', { class: 'lead' }, 'Pick one before the match. Each works alone and gets stronger with its partner on your team.'));
        body.append(
          h(
            'div',
            { class: 'abilities' },
            ups.own.map((u) =>
              h(
                'div',
                { class: 'ability' },
                h('b', null, u.name + ' ', h('small', null, `· with ${u.partner.name}`)),
                u.effect ? h('p', null, u.effect) : null,
                u.bonus ? h('p', null, h('em', null, `With ${u.partner.name}: `), u.bonus) : null,
              ),
            ),
          ),
        );
      }
      if (tips && tips.quirks.length) {
        body.append(sectionHead('Quirks', { info: 'match', infoLabel: 'What quirks are' }));
        body.append(h('div', { class: 'quirks' }, tips.quirks.map((q) => h('div', { class: 'quirk' }, q.text, h('small', null, `Checked ${formatDate(q.asOf)}`)))));
      }
      if (kit && kit.checked) {
        body.append(
          h('p', { class: 'kit-checked' }, `Checked against every patch since launch, last on ${formatDate(kit.checked)}. Written in our own words, so in-game names and numbers may differ slightly.`),
        );
      }
    }
    $('detail').replaceChildren(
      h(
        'div',
        { class: 'sheet-head' },
        backTo ? h('button', { type: 'button', class: 'icon-btn', 'aria-label': `Back to ${backTo.name}`, onClick: popDetail }, icon('back')) : null,
        avatar(hero, 48),
        h(
          'div',
          { class: 'dh-title' },
          h('h1', { class: 'dh-name', id: 'detail-title' }, hero.name),
          h('div', { class: 'dh-role' }, roleTag(hero.role), hero.isNew ? h('span', { class: 'new' }, 'New this season') : null),
        ),
        h('button', { type: 'button', class: 'icon-btn', 'aria-label': 'Close', onClick: closeDetail }, icon('close')),
      ),
      body,
    );
    $('detail').hidden = false;
    body.scrollTop = oldTop;
  }

  // ---- Glossary page ----
  function openGlossary() {
    $('glossary').replaceChildren(
      h(
        'div',
        { class: 'sheet-head' },
        h('h1', { class: 'glossary-title', id: 'glossary-title' }, 'Glossary'),
        h('button', { type: 'button', class: 'icon-btn', 'aria-label': 'Close', onClick: closeGlossary }, icon('close')),
      ),
      h(
        'div',
        { class: 'sheet-body' },
        h('p', { class: 'term-intro', style: 'margin-top:10px' }, 'What the labels, tags and terms in the app mean.'),
        GLOSSARY.map((g) => [eyebrow(g.title), glossaryTerms(g)]),
      ),
    );
    $('glossary').hidden = false;
  }

    $('glossary').hidden = true;
  }

      null,
      h('p', { class: 'lede' }, `The lineups shaping ${DATA.seasonShort} ranked, and how to beat each one.`),
      DATA.comps.map((c) =>
        h(
          'article',
          { class: 'comp' },
          h('header', { class: 'comp-head' }, h('h2', { class: 'comp-name' }, c.name), h('span', { class: 'comp-split' }, `${c.style} · ${c.split}`)),
          h('p', { class: 'comp-sum' }, c.summary),

                  ]),
                ),
              );
            }),
          ),
          c.teamUps.length
            ? h(

                { class: 'teamups' },
                h('span', { class: 'label' }, 'Team-ups'),
                h(
                  'ul',
                  null,
                  c.teamUps.map((t) => h('li', null, h('strong', null, t.name), ' · ', t.heroes.map((id) => IDX[id].name).join(' + '), t.note ? h('span', { class: 'tu-note' }, '. ' + t.note) : null)),
                ),
              )
            : null,
          h(
            'div',
            { class: 'beat' },
            h('span', { class: 'label' }, 'How to beat it'),
            h('p', { class: 'beat-name' }, c.counter.name),
            h('div', { class: 'tier-heroes' }, c.counter.heroes.map((id) => heroChip(IDX[id], () => openDetail(id, 'as')))),
            h('p', { class: 'beat-why' }, c.counter.why),
          ),
          h('p', { class: 'evidence' }, c.evidence),
        ),
      ),
    );
  }

  // ---- About ----
  function aboutView() {
    return h(
      'div',
      null,
      h(
        'div',
        { class: 'season-card' },
        h('h2', null, DATA.season),
        h('p', null, DATA.patch),
        h(
          'div',
          { class: 'facts' },
          h('span', { class: 'fact' }, h('b', null, `Rev ${DATA.revision}`), 'Data version'),
          h('span', { class: 'fact' }, h('b', null, formatDate(DATA.updated)), 'Updated'),
          h('span', { class: 'fact' }, h('b', null, formatDate(DATA.nextReview)), 'Next review'),
        ),
      ),
      eyebrow('Glossary'),
      h(
        'button',
        { type: 'button', class: 'map-btn', onClick: openGlossary },
        h('span', { class: 'map-btn-body' }, h('span', { class: 'map-name' }, 'What every term means'), h('span', { class: 'map-meta' }, 'Tiers, counter tags, bans, play styles, map tags, team-ups and more.')),
        h('span', { class: 'link' }, 'Open'),
      ),
      eyebrow('This season'),
      h('ul', { class: 'bullets' }, DATA.seasonNotes.map((n) => h('li', null, n))),
      eyebrow('How the tiers work'),
      h('ul', { class: 'bullets' }, DATA.methodology.map((n) => h('li', null, n))),
      eyebrow('What changed'),
      h('ul', { class: 'bullets' }, DATA.changelog.map((n) => h('li', null, n))),
      h(
        'div',
        { class: 'disclaimer' },
        h('p', null, 'Hero Counters is an unofficial fan-made tool. It is not affiliated with or endorsed by NetEase Games or Marvel. Hero names belong to their owners.'),
        h('p', null, 'This is a web preview of the phone app. Ads, data updates and privacy choices run in the phone build.'),
      ),
    );
  }

  // Escape closes whatever is on top: a card, then a picker, then steps back through hero pages.
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (!$('overlay').hidden) closeOverlay();
    else if (!$('picker').hidden) closePicker();
    else if (!$('mappicker').hidden) closeMapPicker();
    else if (!$('glossary').hidden) closeGlossary();
    else if (!$('detail').hidden) {
      if (state.detailStack.length > 1) popDetail();
      else closeDetail();
    }
  });

  $('meta').textContent = `${DATA.seasonShort} · updated ${formatDate(DATA.updated)}`;
  renderHeader();
  renderTabs();
  renderView(true);
})();
</script>
